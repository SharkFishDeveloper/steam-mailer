
name: Steam Price Tracker

on:
  schedule:
    # Every 5 days at 6:00 AM IST
    - cron: '30 0 */5 * *'

  # Allow manual execution
  workflow_dispatch:

jobs:
  price-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Steam Price Alert API
        run: |
          curl --fail --show-error --silent \
            --max-time 10 \
            --request POST \
            "https://myapp.vercel.app/api/scrap-game"